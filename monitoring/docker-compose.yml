version: "3.9"

services:
  ui_api:
    build:
      context: .. 
      dockerfile: Dockerfile
    container_name: ui_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../uploads:/app/uploads
    depends_on:
      - prometheus
    networks:
      - xplore_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: xplore_frontend
    ports:
      - "3000:80"
    depends_on:
      - ui_api
    networks:
      - xplore_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - xplore_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - xplore_net

volumes:
  grafana-data:

networks:
  xplore_net:
    driver: bridge